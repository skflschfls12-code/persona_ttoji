"use strict";

/* ======================================================
   클라우드 연결 (Supabase)  —  아래 두 줄만 채우면 돼요.
   비워두면 지금처럼 이 기기 안에만 저장됩니다.
   ====================================================== */
var SUPA_URL = "";
var SUPA_KEY = "";
/* ====================================================== */

var SB={url:SUPA_URL,key:SUPA_KEY,on:!!(SUPA_URL&&SUPA_KEY),tok:null,ref:null};
var canEdit=true;

function sbLoadTok(){try{var t=JSON.parse(localStorage.getItem("cb_tok")||"null");
 if(t&&t.a){SB.tok=t.a;SB.ref=t.r}}catch(e){}}
function sbSaveTok(a,r){SB.tok=a;SB.ref=r;
 try{localStorage.setItem("cb_tok",JSON.stringify({a:a,r:r}))}catch(e){}}
function sbClearTok(){SB.tok=null;SB.ref=null;try{localStorage.removeItem("cb_tok")}catch(e){}}
function sbHead(auth){
 return {apikey:SB.key,"Content-Type":"application/json",
  Authorization:"Bearer "+((auth&&SB.tok)?SB.tok:SB.key)};}
function sbLogin(email,pw){
 return fetch(SB.url+"/auth/v1/token?grant_type=password",{method:"POST",
  headers:{apikey:SB.key,"Content-Type":"application/json"},
  body:JSON.stringify({email:email,password:pw})})
 .then(function(r){return r.json()})
 .then(function(j){
  if(!j.access_token) throw new Error(j.error_description||j.msg||j.message||"로그인 실패");
  sbSaveTok(j.access_token,j.refresh_token); return true;});
}
function sbRefresh(){
 if(!SB.ref) return Promise.reject(new Error("no refresh"));
 return fetch(SB.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",
  headers:{apikey:SB.key,"Content-Type":"application/json"},
  body:JSON.stringify({refresh_token:SB.ref})})
 .then(function(r){return r.json()})
 .then(function(j){if(!j.access_token) throw new Error("refresh");
  sbSaveTok(j.access_token,j.refresh_token); return true;});
}
function sbGet(){
 return fetch(SB.url+"/rest/v1/book?id=eq.main&select=data",{headers:sbHead(false)})
 .then(function(r){if(!r.ok) throw new Error("read");return r.json()})
 .then(function(a){
  if(!a||!a[0]||!a[0].data) return null;
  try{return JSON.parse(a[0].data)}catch(e){return null}});
}
function sbPut(obj,retry){
 return fetch(SB.url+"/rest/v1/book",{method:"POST",
  headers:{apikey:SB.key,"Content-Type":"application/json",
   Authorization:"Bearer "+(SB.tok||SB.key),Prefer:"resolution=merge-duplicates"},
  body:JSON.stringify({id:"main",data:JSON.stringify(obj)})})
 .then(function(r){
  if((r.status===401||r.status===403)&&!retry)
   return sbRefresh().then(function(){return sbPut(obj,true)});
  if(!r.ok) return r.text().then(function(t){throw new Error(t||r.status)});
  return true;});
}

function openDB(){return new Promise(function(res,rej){

function dbGet(k){return openDB().then(function(d){return new Promise(function(res,rej){
 var t=d.transaction(STORE,"readonly").objectStore(STORE).get(k);
 t.onsuccess=function(){res(t.result)};t.onerror=function(){rej(t.error)};});})
 .catch(function(){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}});}
function dbSet(k,v){return openDB().then(function(d){return new Promise(function(res,rej){

function tapeOf(ch){var t=(ch&&ch.tape)||{};return {p:t.p||"",c:t.c||"",e:t.e||"e-torn"}}
function tapeCls(ch,i){
 var t=tapeOf(ch);
 return "tape "+(t.p||("t"+((i%3)+1)))+" "+t.e;
}
function tapeHex(ch){var t=tapeOf(ch);return (t.c||ch.color)+"7A"}
function dressTapes(node,ch){
 Array.prototype.forEach.call(node.querySelectorAll(".tape"),function(el2){
  el2.style.setProperty("--tape",tapeHex(ch))});
}

function readFileAsURL(f){return new Promise(function(res,rej){
 var fr=new FileReader(); fr.onerror=function(){rej(new Error("read"))};
 fr.onload=function(e){res(e.target.result)}; fr.readAsDataURL(f);});}

function copyText(txt,btn){
 function done(){
  if(btn){var o=btn.textContent;btn.textContent="복사됨 ✓";btn.classList.add("done");
   setTimeout(function(){btn.textContent=o;btn.classList.remove("done")},1600);}
  toast("복사했어요 ✧");
 }
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(txt).then(done).catch(fallback);
 } else fallback();
 function fallback(){
  var ta=document.createElement("textarea");
  ta.value=txt; ta.setAttribute("readonly","");
  ta.style.position="fixed"; ta.style.top="-1000px";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,txt.length);
  try{document.execCommand("copy");done()}catch(e){toast("복사가 안 됐어요. 길게 눌러 직접 복사해 주세요")}
  ta.remove();
 }
}

function blankNote(){return{id:uid(),title:"",body:"",color:pal()[0],made:Date.now()}}
function fmt(n){return n>1048576?(n/1048576).toFixed(1)+"MB":Math.round(n/1024)+"KB"}
function dstr(t){var d=new Date(t);return d.getFullYear()+"."+(d.getMonth()+1)+"."+d.getDate()}
function el(html){var t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild}

function shrink(file,max,q){max=max||640;q=q||0.74;
 return new Promise(function(res,rej){
  var fr=new FileReader();
  fr.onerror=function(){rej(new Error("read"))};
  fr.onload=function(e){
   var img=new Image();
   img.onerror=function(){rej(new Error("decode"))};
   img.onload=function(){
    var s=Math.min(1,max/Math.max(img.width,img.height));
    var w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));
    var c=document.createElement("canvas");c.width=w;c.height=h;
    var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    res(c.toDataURL("image/jpeg",q));};
   img.src=e.target.result;};
  fr.readAsDataURL(file);});}

/* ---------- 반짝이 ---------- */
function burst(x,y,color,n){
 if(calm) return;
 n=n||6;
 for(var i=0;i<n;i++){
  var s=document.createElement("span");
  s.className="fxs";
  var size=5+Math.random()*8;
  s.style.width=size+"px"; s.style.height=size+"px";
  s.style.left=x+"px"; s.style.top=y+"px";
  s.style.background=color;
  var a=Math.random()*Math.PI*2, dist=20+Math.random()*30;
  s.style.setProperty("--dx",(Math.cos(a)*dist).toFixed(1)+"px");
  s.style.setProperty("--dy",(Math.sin(a)*dist-12).toFixed(1)+"px");
  s.style.animationDelay=(Math.random()*70).toFixed(0)+"ms";
  fxLayer.appendChild(s);
  (function(node){setTimeout(function(){node.remove()},780)})(s);
 }
}
function cheer(color){
 var x=window.innerWidth/2, y=window.innerHeight/2.4;
 burst(x,y,color||accent(),14);
}
function accent(){return getComputedStyle(document.body).getPropertyValue("--accent").trim()||"#F49AB4"}

document.addEventListener("pointerdown",function(e){
 var t=e.target.closest?e.target.closest("button,.card,.note,label.drop"):null;
 if(!t) return;
 burst(e.clientX,e.clientY,t.getAttribute("data-fx")||accent());
},{passive:true});

function fillSky(box,mode){
 box.innerHTML="";
 if(calm||mode==="none") return;
 var i,s;
 if(mode==="star"||mode==="both"){
  var sn=(mode==="both")?9:16;
  for(i=0;i<sn;i++){
   s=el('<span class="sp"><i></i></span>');
   var size=6+Math.random()*13;
   s.style.width=size+"px"; s.style.height=size+"px";
   s.style.left=(Math.random()*95)+"%";
   s.style.top=(Math.random()*93)+"%";
   s.style.animationDuration=(11+Math.random()*9)+"s";
   s.style.animationDelay=(-Math.random()*10)+"s";
   s.firstElementChild.style.animationDuration=(5+Math.random()*5)+"s";
   s.firstElementChild.style.animationDelay=(-Math.random()*7)+"s";
   box.appendChild(s);}
 }
 if(mode==="petal"||mode==="both"){
  var pn=(mode==="both")?10:15;
  for(i=0;i<pn;i++){
   s=el('<span class="pt"><i></i></span>');
   var w=9+Math.random()*10;
   s.style.width=w+"px"; s.style.height=(w*0.78)+"px";
   s.style.left=(Math.random()*98)+"%";
   s.style.animationDuration=(13+Math.random()*13)+"s";
   s.style.animationDelay=(-Math.random()*24)+"s";
   s.firstElementChild.style.animationDuration=(2.6+Math.random()*3)+"s";
   s.firstElementChild.style.opacity=(0.32+Math.random()*0.3).toFixed(2);
   box.appendChild(s);}
 }
}

function toast(msg){
 var old=document.querySelector(".toast"); if(old) old.remove();
 var d=el('<div class="toast">'+esc(msg)+'</div>');
 document.body.appendChild(d); setTimeout(function(){d.remove()},2400);

function worlds(){
 var o=[],seen={};
 S.characters.forEach(function(c){
  if(c.world&&!seen[c.world]){seen[c.world]=1;o.push(c.world)}});
 return o;
}
function usedColors(){
 var o=[],seen={};
 S.characters.forEach(function(c){if(c.color&&!seen[c.color]){seen[c.color]=1;o.push(c.color)}});
 return pal().filter(function(c){return seen[c]}).concat(o.filter(function(c){return pal().indexOf(c)<0}));
}
function buildSwatches(cur,onPick){
 var sw=el('<div class="sw"></div>');
 var custom=el('<label class="swdot custom" title="직접 고르기">✎<input type="color" class="hidden"></label>');
 var ci=custom.querySelector("input");
 function mark(){
  Array.prototype.forEach.call(sw.querySelectorAll(".swdot"),function(x){x.classList.remove("on")});
  var hit=sw.querySelector('[data-c="'+cur+'"]');
  if(hit) hit.classList.add("on"); else custom.classList.add("on");
 }
 pal().forEach(function(c){
  var b=el('<button class="swdot" data-c="'+esc(c)+'" title="'+esc(gname(c))+'" aria-label="'+esc(gname(c)||"색")+'"></button>');
  b.style.background=c; b.setAttribute("data-fx",c);
  b.addEventListener("click",function(){cur=c;onPick(c);mark()});
  sw.appendChild(b);});
 if(cur&&pal().indexOf(cur)<0){custom.style.background=cur}
 ci.value=/^#[0-9a-fA-F]{6}$/.test(cur||"")?cur:"#F49AB4";
 ci.addEventListener("input",function(){
  cur=ci.value; custom.style.background=cur; custom.setAttribute("data-fx",cur);
  onPick(cur); mark();});
 sw.appendChild(custom); mark();
 return sw;
}
function setPaletteColor(i,nc){
 var old=S.palette[i];
 if(!nc||old===nc) return;
 S.palette[i]=nc;
 S.characters.forEach(function(c){if(c.color===old) c.color=nc});
 S.notes.forEach(function(n){if(n.color===old) n.color=nc});
 if(S.groups[old]!==undefined){S.groups[nc]=S.groups[old];delete S.groups[old]}
 if(colorF===old) colorF=nc;
 save();
}
function gname(c){return (S.groups&&S.groups[c])||""}

function filtered(){
 var k=q.trim().toLowerCase();
 var list=S.characters.filter(function(c){
  if(colorF&&c.color!==colorF) return false;
  var ps=c.posts||[];
  if(worldF!=="전체"&&c.world!==worldF) return false;
  if(!k) return true;
  var hay=[c.name,c.alias,c.world,c.summary,c.body,(c.tags||[]).join(" "),
   (c.fields||[]).map(function(f){return f.k+f.v}).join(" "),
   ps.map(function(p){return p.world+" "+p.title+" "+p.body}).join(" ")].join(" ").toLowerCase();
  return hay.indexOf(k)>-1;});
 if(sortBy==="name") list.sort(function(a,b){return a.name.localeCompare(b.name,"ko")});
 else if(sortBy==="old") list.sort(function(a,b){return a.made-b.made});
 else list.sort(function(a,b){return b.made-a.made});
 return list;
}

function viewNote(n,isNew){
 stopAudio(); applyTheme(); app.innerHTML="";
 var wrap=el('<div class="detail"></div>');
 var bar=el('<div class="dbar"></div>');
 var back=el('<button class="icon" aria-label="목록으로">←</button>');
 back.addEventListener("click",function(){section="notes";viewHome()});
 var btns=el('<div class="dbtns"></div>');
 var del=el('<button class="ghost">지우기</button>');
 del.addEventListener("click",function(){askDeleteNote(n,isNew)});
 var sv=el('<button class="save">저장하기</button>');
 sv.addEventListener("click",submit);
 btns.appendChild(del);btns.appendChild(sv);
 bar.appendChild(back);bar.appendChild(btns);wrap.appendChild(bar);

 var ti=el('<input class="in big" placeholder="제목">');
 ti.value=n.title||""; wrap.appendChild(ti);

 wrap.appendChild(el('<div class="flabel">이 장의 색</div>'));
 wrap.appendChild(buildSwatches(n.color,function(c){n.color=c}));

 wrap.appendChild(el('<div class="flabel">내용</div>'));
 var ta=el('<textarea class="ta tall" placeholder="아무거나 적어도 돼요"></textarea>');
 ta.value=n.body||""; wrap.appendChild(ta);

 var sv2=el('<button class="save wide">저장하기</button>');
 sv2.addEventListener("click",submit); wrap.appendChild(sv2);

 function submit(){
  n.title=ti.value.trim(); n.body=ta.value;
  if(!n.title&&!n.body.trim()){toast("아무것도 안 적었어요");return}
  var idx=-1; S.notes.forEach(function(x,i){if(x.id===n.id) idx=i});
  if(idx>-1) S.notes[idx]=n; else S.notes.unshift(n);
  save().then(function(){cheer(n.color);toast("적어뒀어요 ✧");section="notes";viewHome()});
 }
 app.appendChild(wrap); window.scrollTo(0,0);
}

 wrap.style.setProperty("--me",n.color);

/* ---------- 프롬프트 모음 ---------- */
var prCat="전체", prPage=0, PR_PER=12;
function blankPrompt(){return{id:uid(),cat:"",title:"",text:"",image:"",made:Date.now()}}
function prCats(){var o=[],seen={};
 (S.prompts||[]).forEach(function(x){if(x.cat&&!seen[x.cat]){seen[x.cat]=1;o.push(x.cat)}});
 return o;}
function prNo(id){
 var all=(S.prompts||[]).slice().sort(function(a,b){return a.made-b.made});
 for(var i=0;i<all.length;i++) if(all[i].id===id) return ("00"+(i+1)).slice(-3);
 return "000";}

function buildPrompts(){
 var all=(S.prompts||[]).slice().sort(function(a,b){return a.made-b.made});
 var cats=prCats();

 var tools=el('<div class="tools"></div>');
 var si=el('<input class="search" placeholder="프롬프트 안에서 찾기">');
 si.value=q;
 si.addEventListener("input",function(){q=si.value;prPage=0;paintPr()});
 tools.appendChild(si); app.appendChild(tools);

 var cbox=el('<div class="chips" id="prchips"></div>');
 app.appendChild(cbox);
 function paintChipsPr(){
  cbox.innerHTML="";
  if(!cats.length) return;
  ["전체"].concat(cats).forEach(function(c){
   var b=el('<button class="chip'+(prCat===c?" on":"")+'">'+esc(c)+'</button>');
   b.addEventListener("click",function(){prCat=c;prPage=0;paintChipsPr();paintPr()});
   cbox.appendChild(b);});
 }
 paintChipsPr();

 app.appendChild(el('<div class="prgrid" id="prgrid"></div>'));
 app.appendChild(el('<div id="prpager"></div>'));

 if(canEdit){
  var fab=el('<button class="fab" aria-label="프롬프트 추가">＋</button>');
  fab.addEventListener("click",function(){editPrompt(blankPrompt(),true)});
  app.appendChild(fab);
 }

 function filteredPr(){
  var k=q.trim().toLowerCase();
  return all.filter(function(x){
   if(prCat!=="전체"&&x.cat!==prCat) return false;
   if(!k) return true;
   return ((x.title||"")+" "+(x.cat||"")+" "+(x.text||"")).toLowerCase().indexOf(k)>-1;});
 }

 function paintPr(){
  var g=document.getElementById("prgrid"), pgr=document.getElementById("prpager");
  if(!g) return;
  g.innerHTML=""; pgr.innerHTML="";
  var list=filteredPr();
  if(!all.length){
   var e=el('<div class="empty"><div class="bigstar">✎</div>'+
    '<p class="e1">프롬프트가 비었어요</p>'+
    '<p class="e2">자주 쓰는 의상·구도 프롬프트를<br>모아두면 복사만 하면 돼요</p></div>');
   if(canEdit){
    var btn=el('<button class="cta">첫 프롬프트 넣기</button>');
    btn.addEventListener("click",function(){editPrompt(blankPrompt(),true)});
    e.appendChild(btn);}
   g.appendChild(e); return;}
  if(!list.length){
   g.appendChild(el('<div class="empty"><div class="bigstar">✧</div><p class="e2">여긴 아직 없네요</p></div>'));
   return;}

  var pages=Math.max(1,Math.ceil(list.length/PR_PER));
  if(prPage>=pages) prPage=pages-1;
  list.slice(prPage*PR_PER,(prPage+1)*PR_PER).forEach(function(x){
   var col=x.color||(pal()[0]);
   var shot=x.image?'<img src="'+x.image+'" alt="">'
    :'<span class="pnone" style="color:'+esc(col)+';background:'+esc(col)+'22">✧</span>';
   var card=el('<div class="prcard">'+
    '<button class="prbody">'+
     '<span class="prshot">'+shot+
      '<span class="prno">#'+prNo(x.id)+'</span>'+
      (x.cat?'<span class="prcat" style="background:'+esc(col)+'">'+esc(x.cat)+'</span>':"")+
     '</span>'+
    '</button>'+
    '<div class="prtext">'+esc(x.text||"")+'</div>'+
    '<button class="prcopy">복사</button></div>');
   card.querySelector(".prbody").addEventListener("click",function(){viewPrompt(x.id)});
   var cbtn=card.querySelector(".prcopy");
   cbtn.style.background=col;
   cbtn.setAttribute("data-fx",col);
   cbtn.addEventListener("click",function(){copyText(x.text||"",cbtn)});
   g.appendChild(card);});

  if(pages>1){
   var pg=el('<div class="pager"><button class="pgbtn prev">‹</button>'+
    '<span class="pgnum">'+(prPage+1)+' / '+pages+'</span>'+
    '<button class="pgbtn next">›</button></div>');
   var pv=pg.querySelector(".prev"), nx=pg.querySelector(".next");
   if(prPage===0) pv.disabled=true;
   if(prPage>=pages-1) nx.disabled=true;
   pv.addEventListener("click",function(){prPage--;paintPr();window.scrollTo(0,0)});
   nx.addEventListener("click",function(){prPage++;paintPr();window.scrollTo(0,0)});
   pgr.appendChild(pg);}
 }
 paintPr();
}

  '<div class="chips tfont"></div>'+
  '<div class="sh2">테마</div><div class="themerow"></div>'+
  '<div class="sh2">색깔 칸</div>'+
  '<button class="btn wide gedit" style="border:2px solid var(--line);background:var(--soft);color:var(--ink);margin:0">색깔 바꾸고 이름 붙이기</button>'+
  '<div class="sh2">클라우드</div><div class="cloudbox"></div>'+
  '<div class="sh2">백업</div>'+
  '<p class="note2">우리 애들은 이 브라우저 안에만 있어요. 인터넷에 올라가지 않으니 주소를 아는 사람이 들어와도 텅 빈 화면만 보여요.<br>'+
  '지금 캐릭터 '+S.characters.length+'명 · 노트 '+S.notes.length+'장 · 프롬프트 '+(S.prompts||[]).length+'개 · 약 '+fmt(size)+'<br><br>'+
  '기기를 바꾸거나 브라우저 기록을 지우면 사라져요. 가끔 내보내 두면 안심이에요.</p>'+
  '<div class="row2"><button class="btn out">내보내기</button><button class="btn in2">불러오기</button></div>'+
  '<p class="note2" style="margin-top:16px">브라우저 공유 메뉴에서 “홈 화면에 추가”를 하면 앱처럼 열려요.</p>'+
  '<button class="btn wide close">닫기</button>'+
  '<input type="file" accept="image/*" multiple class="hidden cvfile">'+
  '<input type="file" accept=".json,application/json" class="hidden imp"></div>');

 if(!S.cover) S.cover={images:[],label:"들어가기",sub:""};
 var covrow=box.querySelector(".covrow"), cvfile=box.querySelector(".cvfile");
 function paintCov(){
  covrow.innerHTML="";
  (S.cover.images||[]).forEach(function(src,i){
   var t=el('<div class="covthumb"><button class="gx" aria-label="지우기">×</button></div>');
   t.style.backgroundImage="url("+src+")";
   t.querySelector(".gx").addEventListener("click",function(){
    S.cover.images.splice(i,1);save();paintCov()});
   covrow.appendChild(t);});
  if(!S.cover.images||!S.cover.images.length)
   covrow.appendChild(el('<p class="note2" style="margin:0">아직 표지 사진이 없어요</p>'));
 }
 paintCov();
 box.querySelector(".cvadd").addEventListener("click",function(){cvfile.click()});
 cvfile.addEventListener("change",function(){
  var files=Array.prototype.slice.call(cvfile.files,0,4); cvfile.value="";
  if(!files.length) return;
  toast("사진 넣는 중…");
  Promise.all(files.map(function(f){return shrink(f,1400,0.8)})).then(function(us){
   S.cover.images=(S.cover.images||[]).concat(us).slice(0,5);
   save().then(function(){paintCov();cheer();toast("표지에 넣었어요 ✧")});})
   .catch(function(){toast("사진을 못 열었어요…")});});
 var cl=box.querySelector(".cvlab"), cs=box.querySelector(".cvsub");
 cl.value=S.cover.label||""; cs.value=S.cover.sub||"";
 cl.addEventListener("input",function(){S.cover.label=cl.value;save()});
 cs.addEventListener("input",function(){S.cover.sub=cs.value;save()});
 var cfbox=box.querySelector(".cvfont");
 Object.keys(CVFONTS).forEach(function(k){
  var b=el('<button class="chip'+((S.cover.font||"batang")===k?" on":"")+'">'+esc(CVFONTS[k].label)+'</button>');
  b.style.fontFamily=CVFONTS[k].css;
  b.addEventListener("click",function(){
   S.cover.font=k; save();
   Array.prototype.forEach.call(cfbox.querySelectorAll(".chip"),function(x){x.classList.remove("on")});
   b.classList.add("on");});
  cfbox.appendChild(b);});

 var bp=box.querySelector(".bgpick"); [["petal","꽃잎"],["star","별가루"],["both","둘 다"],["none","없음"]].forEach(function(p){
  var b=el('<button class="chip'+((S.bg||"petal")===p[0]?" on":"")+'">'+p[1]+'</button>');
  b.addEventListener("click",function(){
   S.bg=p[0]; save(); makeSky();
   Array.prototype.forEach.call(bp.querySelectorAll(".chip"),function(x){x.classList.remove("on")});
   b.classList.add("on");});
  bp.appendChild(b);});

 var cb=box.querySelector(".cloudbox");
 function paintCloud(){
  cb.innerHTML="";
  if(!SB.on){
   cb.appendChild(el('<p class="note2">아직 연결 안 됐어요. index.html 맨 위의 SUPA_URL, SUPA_KEY 두 줄을 채우면 켜져요.</p>'));
   return;}
  if(!SB.tok){
   var f=el('<div><p class="note2">지금은 보기만 돼요. 고치려면 로그인하세요.</p>'+
    '<input class="in em" type="email" placeholder="이메일" autocomplete="username" style="margin-bottom:8px">'+
    '<input class="in pw" type="password" placeholder="비밀번호" autocomplete="current-password" style="margin-bottom:10px">'+
    '<button class="btn wide go" style="border:2px solid var(--line);background:var(--soft);color:var(--ink);margin:0">로그인</button></div>');
   f.querySelector(".go").addEventListener("click",function(){
    var em=f.querySelector(".em").value.trim(), pw=f.querySelector(".pw").value;
    if(!em||!pw){toast("이메일과 비밀번호를 넣어주세요");return}
    toast("로그인 중…");
    sbLogin(em,pw).then(function(){
     canEdit=true; cheer(); toast("로그인했어요 ✧"); paintCloud();})
    .catch(function(e){toast("로그인 실패 — "+(e.message||"").slice(0,40))});});
   cb.appendChild(f); return;}
  var g=el('<div><p class="note2">연결됨 ✧ 고친 내용이 자동으로 올라가요. 주소만 알면 누구나 볼 수 있으니 아는 사람에게만 알려주세요.</p>'+
   '<div class="row2"><button class="btn up">지금 올리기</button><button class="btn down">지금 받아오기</button></div>'+
   '<button class="btn wide out2" style="margin-top:10px">로그아웃</button></div>');
  g.querySelector(".up").addEventListener("click",function(){
   toast("올리는 중…");
   sbPut(S).then(function(){cheer();toast("올렸어요 ✧")})
    .catch(function(e){toast("못 올렸어요 — "+(e.message||"").slice(0,40))});});
  g.querySelector(".down").addEventListener("click",function(){
   toast("받아오는 중…");
   sbGet().then(function(c){
    if(!c){toast("클라우드가 비어 있어요");return}
    S=normalize(c); save().then(function(){w.remove();applyTheme();makeSky();viewHome();toast("받아왔어요 ✧")});})
    .catch(function(){toast("받아오지 못했어요")});});
  g.querySelector(".out2").addEventListener("click",function(){
   sbClearTok(); canEdit=false; toast("로그아웃했어요"); paintCloud();});
  cb.appendChild(g);
 }
 paintCloud();

 var tf=box.querySelector(".tfont");
 Object.keys(CVFONTS).forEach(function(k){
  var b=el('<button class="chip'+((S.titleFont||"jua")===k?" on":"")+'">'+esc(CVFONTS[k].label)+'</button>');
  b.style.fontFamily=CVFONTS[k].css;
  b.addEventListener("click",function(){
   S.titleFont=k; save();
   Array.prototype.forEach.call(tf.querySelectorAll(".chip"),function(x){x.classList.remove("on")});
   b.classList.add("on");});
  tf.appendChild(b);});

 var tr=box.querySelector(".themerow");
 Object.keys(THEMES).forEach(function(k){
  var b=el('<button class="tcard'+(S.theme===k?" on":"")+'"><b></b>'+esc(THEMES[k].label)+'</button>');
  b.querySelector("b").style.background=THEMES[k].dot;
  b.setAttribute("data-fx",THEMES[k].dot);
  b.addEventListener("click",function(){
   S.theme=k; save(); applyTheme(); makeSky();
   Array.prototype.forEach.call(tr.querySelectorAll(".tcard"),function(x){x.classList.remove("on")});
   b.classList.add("on");});
  tr.appendChild(b);});

 var w=sheet(box);
 box.querySelector(".cvsee").addEventListener("click",function(){w.remove();showCover()});
 box.querySelector(".gedit").addEventListener("click",function(){w.remove();openGroupNames()});
 box.querySelector(".close").addEventListener("click",function(){w.remove();applyTheme();makeSky();viewHome()});
 box.querySelector(".out").addEventListener("click",function(){
  var blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download="도감백업-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},4000);
  cheer(); toast("백업했어요 ✧");});
 var imp=box.querySelector(".imp");
 box.querySelector(".in2").addEventListener("click",function(){imp.click()});
 imp.addEventListener("change",function(){
  var f=imp.files[0]; imp.value=""; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(e){
   try{
    var inc=JSON.parse(e.target.result);
    if(!inc||!Array.isArray(inc.characters)) throw new Error("형식");
    var have={}; S.characters.forEach(function(c){have[c.id]=1});
    var add=inc.characters.map(function(c){if(have[c.id]) c.id=uid(); return c});
    S.characters=S.characters.concat(add);
    if(Array.isArray(inc.notes)){
     var nh={}; S.notes.forEach(function(x){nh[x.id]=1});
     S.notes=S.notes.concat(inc.notes.map(function(x){if(nh[x.id]) x.id=uid(); return x}));
    }
    if(Array.isArray(inc.prompts)){
     var ph={}; S.prompts.forEach(function(x){ph[x.id]=1});
     S.prompts=S.prompts.concat(inc.prompts.map(function(x){if(ph[x.id]) x.id=uid(); return x}));
    }
    if(inc.groups) for(var g in inc.groups){ if(!S.groups[g]) S.groups[g]=inc.groups[g]; }
    save().then(function(){w.remove();viewHome();cheer();toast(add.length+"명이 돌아왔어요 ✧")});
   }catch(err){toast("그 파일은 못 읽겠어요…")}};
  fr.readAsText(f);});
}

/* ---------- 시작 ---------- */
function normalize(v){
 var o=(v&&Array.isArray(v.characters))?v:{title:"내 애기들 ♡",theme:"strawberry",characters:[]};
 if(!o.theme||!THEMES[o.theme]) o.theme="strawberry";
 if(!o.bg) o.bg="petal";
 if(!Array.isArray(o.notes)) o.notes=[];
 if(!Array.isArray(o.prompts)) o.prompts=[];
 if(!o.groups||typeof o.groups!=="object") o.groups={};
 if(!Array.isArray(o.palette)||o.palette.length!==SWATCHES.length) o.palette=SWATCHES.slice();
 if(!o.cover||typeof o.cover!=="object") o.cover={images:[],label:"들어가기",sub:"",font:"batang"};
 if(!Array.isArray(o.cover.images)) o.cover.images=[];
 if(!o.cover.font||!CVFONTS[o.cover.font]) o.cover.font="batang";
 if(!o.titleFont||!CVFONTS[o.titleFont]) o.titleFont="jua";
 if(o.title==="내 캐릭터 도감") o.title="내 애기들 ♡";
 if(typeof o.savedAt!=="number") o.savedAt=0;
 return o;
}

sbLoadTok();
canEdit = !SB.on || !!SB.tok;

var localP = dbGet(KEY).catch(function(){return null});
var cloudP = SB.on ? sbGet().catch(function(){return null}) : Promise.resolve(null);

Promise.all([localP,cloudP]).then(function(r){
 var loc=r[0], cloud=r[1], pickd;
 if(!SB.on) pickd=loc;
 else if(!SB.tok) pickd=cloud||loc;
 else if(loc&&cloud) pickd=((cloud.savedAt||0)>(loc.savedAt||0))?cloud:loc;
 else pickd=loc||cloud;
 S=normalize(pickd);
 applyTheme(); makeSky(); showCover();
}).catch(function(){
 S=normalize(null);
 applyTheme(); makeSky(); showCover();
});
</script>
